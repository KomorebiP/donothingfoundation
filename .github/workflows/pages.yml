name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_sha256:
        description: SHA-256 of the locally verified browser update ZIP
        required: true
        type: string
permissions: {}
concurrency:
  group: pages-deployment
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    # Reading a draft release requires repository push access.
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.runtime.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify and extract the runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: "d4175c92b4600f9fa989b9747e123928997b094d80101c10327989bc96c27c45"
          REQUESTED_SHA256: ${{ inputs.runtime_sha256 }}
          RELEASE_ID: "443449271"
          ASSET_ID: "740901991"
          STAGING_TAG: "v116.1-web.3-runtime"
          UPDATE_SHA256: "72e1c2ee97105f30c5973f99a15f455c0b4d1c8b235d4314263c5894845ce38b"
          UPDATE_RELEASE_ID: "443663681"
          UPDATE_ASSET_ID: "741618253"
          UPDATE_STAGING_TAG: "v116.1-web.12-runtime"
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SHA256" && "$REQUESTED_SHA256" != "$UPDATE_SHA256" ]]; then
            echo "::error::The requested digest differs from the browser update pinned in this revision."
            exit 1
          fi
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e --arg tag "$STAGING_TAG" '.draft == true and .tag_name == $tag' <<< "$draft" >/dev/null
          asset=$(jq -c --argjson id "$ASSET_ID" '[.assets[] | select(.id == $id and .name == "BiB_Web_Runtime_v116_1.zip" and .state == "uploaded")] | first // empty' <<< "$draft")
          if [[ -z "$asset" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              echo "::error::The runtime ZIP is missing from the staging draft."
              exit 1
            fi
            echo "The runtime ZIP has not been staged. Keeping the current Pages deployment."
            exit 0
          fi
          asset_id=$(jq -er '.id' <<< "$asset")
          digest=$(jq -er '.digest' <<< "$asset")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ "$digest" != "sha256:$EXPECTED_SHA256" ]]; then
            echo "::error::GitHub's runtime digest differs from the verified local digest."
            exit 1
          fi
          archive="$RUNNER_TEMP/BiB_Web_Runtime_v116_1.zip"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$archive"
          update=$(gh api "repos/$GITHUB_REPOSITORY/releases/$UPDATE_RELEASE_ID")
          jq -e --arg tag "$UPDATE_STAGING_TAG" --argjson id "$UPDATE_ASSET_ID" --arg digest "sha256:$UPDATE_SHA256" '
            .draft == true and .tag_name == $tag and any(.assets[];
              .id == $id and .name == "BiB_Web_Update_116_1_web_12.zip"
              and .state == "uploaded" and .digest == $digest)
          ' <<< "$update" >/dev/null
          update_archive="$RUNNER_TEMP/BiB_Web_Update_116_1_web_12.zip"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$UPDATE_ASSET_ID" > "$update_archive"
          python3 tools/extract_pages_runtime.py "$archive" "${digest#sha256:}" _site --browser-update "$update_archive" "$UPDATE_SHA256"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        if: steps.runtime.outputs.ready == 'true'
        with:
          path: _site
  deploy:
    if: needs.prepare.outputs.ready == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
